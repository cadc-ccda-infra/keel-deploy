apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canfar-arc-prod
  namespace: canfar-argocd
  labels:
    argocd.argoproj.io/domain: canfar.net
    argocd.argoproj.io/environment: production
    argocd.argoproj.io/service: arc
spec:
  project: canfar
  sources:
    - repoURL: oci://images.opencadc.org/platform/charts/cavern
      path: .
      targetRevision: 0.10.9
      helm:
        valueFiles:
          - $values/helm/values/canfar.net/arc/base.yaml
          - $values/helm/values/canfar.net/arc/prod.yaml
    - repoURL: https://github.com/cadc-ccda-infra/keel-deploy.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: canfar-system-production
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
