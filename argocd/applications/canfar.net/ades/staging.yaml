apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canfar-ades-staging
  namespace: canfar-argocd
  labels:
    argocd.argoproj.io/domain: canfar.net
    argocd.argoproj.io/environment: staging
    argocd.argoproj.io/service: ades
spec:
  project: canfar
  source:
    repoURL: https://github.com/cadc-ccda-infra/keel-deploy.git
    targetRevision: main
    path: manifests/canfar.net/ades/staging
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: canfar-system-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
