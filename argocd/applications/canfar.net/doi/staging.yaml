apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canfar-doi-staging
  namespace: canfar-argocd
  labels:
    argocd.argoproj.io/domain: canfar.net
    argocd.argoproj.io/environment: staging
    argocd.argoproj.io/service: doi
spec:
  project: canfar
  sources:
    - repoURL: oci://bucket.canfar.net/charts/doi
      targetRevision: 0.1.2
      path: .
      helm:
        passCredentials: true
        valueFiles:
          - $values/helm/values/canfar.net/doi/base.yaml
          - $values/helm/values/canfar.net/doi/staging.yaml
    - repoURL: https://github.com/cadc-ccda-infra/keel-deploy.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: canfar-system-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
