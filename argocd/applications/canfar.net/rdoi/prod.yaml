apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canfar-rdoi-prod
  namespace: canfar-argocd
  labels:
    argocd.argoproj.io/domain: canfar.net
    argocd.argoproj.io/environment: production
    argocd.argoproj.io/service: rdoi
spec:
  project: canfar
  sources:
    - repoURL: https://images-rc.canfar.net/chartrepo/skaha-system
      chart: doi
      targetRevision: 0.1.1
      helm:
        valueFiles:
          - $values/helm/values/canfar.net/rdoi/base.yaml
          - $values/helm/values/canfar.net/rdoi/prod.yaml
    - repoURL: https://github.com/cadc-ccda-infra/keel-deploy.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: canfar-system-production
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
