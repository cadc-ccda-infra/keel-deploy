apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canfar-reg-dev
  namespace: canfar-argocd
  labels:
    argocd.argoproj.io/domain: dev.canfar.net
    argocd.argoproj.io/environment: dev
    argocd.argoproj.io/service: reg
spec:
  project: canfar
  sources:
    - repoURL: oci://images.opencadc.org/core/charts/reg
      path: .
      targetRevision: 1.2.2
      helm:
        valueFiles:
          - $values/helm/values/canfar.net/reg/base.yaml
          - $values/helm/values/canfar.net/reg/dev.yaml
    - repoURL: https://github.com/cadc-ccda-infra/keel-deploy.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: canfar-system-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
