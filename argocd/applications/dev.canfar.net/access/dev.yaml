apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canfar-access-dev
  namespace: canfar-argocd
  labels:
    argocd.argoproj.io/domain: dev.canfar.net
    argocd.argoproj.io/environment: dev
    argocd.argoproj.io/service: access
spec:
  project: canfar
  sources:
    - repoURL: oci://bucket.canfar.net/charts/access
      path: .
      targetRevision: 0.3.2
      helm:
        valueFiles:
          - $values/helm/values/canfar.net/access/base.yaml
          - $values/helm/values/canfar.net/access/dev.yaml
    - repoURL: https://github.com/cadc-ccda-infra/keel-deploy.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: canfar-system-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
