apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canfar-comet-dev
  namespace: canfar-argocd
  labels:
    argocd.argoproj.io/domain: dev.canfar.net
    argocd.argoproj.io/environment: dev
    argocd.argoproj.io/service: comet
spec:
  project: canfar
  sources:
    - repoURL: oci://images.canfar.net/candiapl/charts/comet
      path: .
      targetRevision: 0.1.0
      helm:
        # Keeps resource names at "comet" so this adopts the existing release
        # instead of running a second Ingress on dev.canfar.net/comet.
        releaseName: comet
        valueFiles:
          - $values/helm/values/canfar.net/comet/base.yaml
          - $values/helm/values/canfar.net/comet/dev.yaml
    - repoURL: https://github.com/cadc-ccda-infra/keel-deploy.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: canfar-comet
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
