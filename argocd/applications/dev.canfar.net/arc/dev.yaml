apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canfar-arc-dev
  namespace: canfar-argocd
  labels:
    argocd.argoproj.io/domain: dev.canfar.net
    argocd.argoproj.io/environment: dev
    argocd.argoproj.io/service: arc
spec:
  project: canfar
  sources:
    # Same chart and version as production.
    - repoURL: oci://images.opencadc.org/platform/charts/cavern
      path: .
      targetRevision: 0.10.9
      helm:
        valueFiles:
          - $values/helm/values/canfar.net/arc/base.yaml
          - $values/helm/values/canfar.net/arc/dev.yaml
    - repoURL: https://github.com/cadc-ccda-infra/keel-deploy.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: canfar-system-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
