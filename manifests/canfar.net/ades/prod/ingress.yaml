# Strip /ades so prod.canfar.net/ades/validate-* maps to the API root paths.
# Matches the Traefik StripPrefix used in at88mph/deployment/rafts/docker-compose.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ades-stripprefix
  namespace: canfar-system-production
spec:
  stripPrefix:
    prefixes:
      - /ades
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ades
  namespace: canfar-system-production
  labels:
    app.kubernetes.io/name: ades
    app.kubernetes.io/component: validator-api
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: canfar-system-production-ades-stripprefix@kubernetescrd
spec:
  rules:
    - host: prod.canfar.net
      http:
        paths:
          - path: /ades
            pathType: Prefix
            backend:
              service:
                name: ades
                port:
                  number: 8080
