apiVersion: apps/v1
kind: Deployment
metadata:
  name: ades
  namespace: canfar-system-prod
  labels:
    app.kubernetes.io/name: ades
    app.kubernetes.io/component: validator-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ades
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ades
        app.kubernetes.io/component: validator-api
    spec:
      imagePullSecrets:
        - name: bucket-registry-auth
      # UID/GID 1001: `validator` user in the ades-validator-api image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ades
          image: bucket.canfar.net/ades-validator-api:1.0.0-20260218T223136
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          livenessProbe:
            httpGet:
              path: /health-check
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health-check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: skaha.opencadc.org/node-type
                    operator: In
                    values:
                      - service-node
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.count
                    operator: DoesNotExist
