apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: canfar-system-production-cavern-pvc
  namespace: canfar-system-production
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1000Gi
  storageClassName: csi-cephfs-sc
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: canfar-workloads-production-pvc
  namespace: canfar-workloads
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1000Gi
  storageClassName: csi-cephfs-sc
  volumeMode: Filesystem
