apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cavern-renewal-pvc
  namespace: canfar-src-production
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1000Gi
  storageClassName: ""
  volumeName: canfar-src-production-cavern-renewal-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: src-cavern-renewal-storage
  namespace: canfar-src-workloads
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1000Gi
  storageClassName: ""
  volumeName: canfar-src-workloads-src-cavern-renewal-storage
