# Bifrost — IVOA DataLink for CAOM.
# Service configuration: https://github.com/opencadc/caom2/tree/main/bifrost#configuration
#
# Runtime files are mounted under /config (ConfigMap + projected cookie-signing Secret).
# Stack-wide settings use global.* (set once on the parent stack chart). Per-service overrides use application.*.
#
# application → ConfigMap file mapping:
#   catalina.properties
#     - uws.*              → org.opencadc.bifrost.uws.{maxActive,url,username,password}
#     - auth.*             → ca.nrc.cadc.auth.* (defaults from global.auth; application.auth overrides)
#     - proxyPort          → tomcat.connector.proxyPort (defaults from global.proxyPort)
#   cadc-registry.properties
#     - registryUrls       → ca.nrc.cadc.reg.client.RegistryClient.baseURL (per entry; defaults from global.registryUrls)
#     - gmsId, cdpId       → IVOA standard → resource ID mappings (defaults from global.gmsId / global.cdpId)
#   bifrost.properties
#     - queryService       → org.opencadc.bifrost.queryService
#     - locatorService     → org.opencadc.bifrost.locatorService
#     - readGrantProviders → org.opencadc.bifrost.readGrantProvider (repeatable)
#   bifrost-logControl.properties  (LogControlServlet; see github.com/opencadc/core/tree/main/cadc-log)
#     - logging.*          → user / username / group / secret (defaults from global.logging; application.logging overrides)
#
# Not rendered from values (set elsewhere):
#   tomcat.connector.proxyName — first host from ingress.hosts or httpRoute.hostnames (enable ingress or httpRoute)
#   RsaSignaturePub.key      — global.cookieSignaturePublicKey.existingSecret (projected Secret volume)
#   contextPath              — WAR context; align ingress paths and HTTP probes (war-rename.conf in image if not default)

replicaCount: 1

image:
  repository: images.opencadc.org/caom2/bifrost
  pullPolicy: Always
  tag: "0.5.8"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /bifrost
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /bifrost

resources: {}

# Paths must match application.contextPath (default bifrost → /bifrost/availability).
livenessProbe:
  httpGet:
    path: /bifrost/availability?detail=min
    port: http
readinessProbe:
  httpGet:
    path: /bifrost/availability
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

global:
  proxyPort: 443
  registryUrls: []
  gmsId: ""
  cdpId: ""
  auth:
    identityManager: ca.nrc.cadc.ac.ACIdentityManager
    enableClientCertHeader: true
  cookieSignaturePublicKey:
    existingSecret:
      name: ""
      key: RsaSignaturePub.key
      path: RsaSignaturePub.key
  logging:
    users: []
    usernames: []
    groups: []
    secret:
      existingSecret:
        name: ""
        key: secret

application:
  # WAR context path (not written to a properties file); match ingress and probes.
  contextPath: bifrost

  # catalina.properties — UWS JDBC pool (same database as argus is typical).
  uws: {}
  #   maxActive: 2
  #   url: jdbc:postgresql://dbhost:5432/caom2
  #   username: ""
  #   password: ""

  # bifrost.properties — registry resource IDs (IVO identifiers).
  queryService: ""
  # locatorService: CAOM artifact URL resolution (e.g. transfer-negotiation / raven).
  locatorService: ""
  # Optional; multiple lines in bifrost.properties.
  readGrantProviders: []

  # Optional per-service overrides (otherwise use global.* for the same keys):
  # registryUrls: []
  # gmsId: ""
  # cdpId: ""
  # proxyPort: 443
  # auth:
  #   identityManager: ca.nrc.cadc.ac.ACIdentityManager
  #   enableClientCertHeader: true
  # logging:
  #   users: []
  #   usernames: []
  #   groups: []
  #   secret:
  #     existingSecret:
  #       name: ""
  #       key: secret