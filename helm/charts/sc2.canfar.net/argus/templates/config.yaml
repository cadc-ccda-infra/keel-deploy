{{- $app := .Values.application -}}
{{- $hostname := required "set ingress.hosts[].host or httpRoute.hostnames[] (enable ingress or httpRoute)" (include "argus.publicHostname" .) -}}
{{- $ctx := trimPrefix "/" (trimSuffix "/" ($app.contextPath | default "argus")) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  cadc-registry.properties: |
    ivo://ivoa.net/std/GMS#search-1.0 = {{ required "global.gmsId" (include "argus.platform.gmsId" .) }}
    http://www.opencadc.org/std/UMS#users-1.0 = {{ include "argus.platform.gmsId" . }}
    ivo://ivoa.net/std/UMS#users-0.1 = {{ include "argus.platform.gmsId" . }}

    ivo://ivoa.net/std/CDP#proxy-1.0 = {{ required "global.cdpId" (include "argus.platform.cdpId" .) }}

    http://www.opencadc.org/std/posix#group-mapping-0.1 = {{ include "argus.platform.gmsId" . }}
    http://www.opencadc.org/std/posix#user-mapping-0.1 = {{ include "argus.platform.gmsId" . }}

    {{- $urls := coalesce $app.registryUrls .Values.global.registryUrls (list) -}}
    {{- range $urls }}
    ca.nrc.cadc.reg.client.RegistryClient.baseURL = {{ . }}
    {{- end }}
  cadc-log.properties: |
    {{- $logG := .Values.global.logging | default dict -}}
    {{- $logA := $app.logging | default dict -}}
    {{- $logUsers := $logA.users | default $logG.users | default (list) -}}
    {{- $logUsernames := $logA.usernames | default $logG.usernames | default (list) -}}
    {{- $logGroups := $logA.groups | default $logG.groups | default (list) -}}
    {{- range $logUsers }}
    user = {{ . }}
    {{- end }}
    {{- range $logUsernames }}
    username = {{ . }}
    {{- end }}
    {{- range $logGroups }}
    group = {{ . }}
    {{- end }}
    {{- $logSecretG := $logG.secret | default dict -}}
    {{- $logSecretA := $logA.secret | default dict -}}
    {{- $logSecretRef := $logSecretA.existingSecret | default $logSecretG.existingSecret | default dict -}}
    {{- $logSecretName := $logSecretRef.name | default "" -}}
    {{- if $logSecretName }}
    {{- $logSecretKeys := $logSecretRef.keys | default (list ($logSecretRef.key | default "secret")) -}}
    {{- $logSecretObj := lookup "v1" "Secret" .Release.Namespace $logSecretName -}}
    {{- if $logSecretObj }}
    {{- range $logSecretKeys }}
    {{- $logSecretVal := index $logSecretObj.data . | b64dec -}}
    secret = {{ $logSecretVal }}
    {{- end }}
    {{- end }}
    {{- end }}
  catalina.properties: |
    tomcat.connector.scheme=https
    tomcat.connector.proxyName={{ $hostname }}
    tomcat.connector.proxyPort={{ include "argus.platform.proxyPort" . }}
    ca.nrc.cadc.auth.PrincipalExtractor.enableClientCertHeader={{ include "argus.platform.enableClientCertHeader" . }}
    ca.nrc.cadc.util.Log4jInit.messageOnly=true
    ca.nrc.cadc.auth.IdentityManager={{ include "argus.platform.identityManager" . }}

    {{- with $app.uws }}
    org.opencadc.argus.uws.maxActive = {{ .maxActive | default 2 }}
    org.opencadc.argus.uws.url = {{ required "application.uws.url" .url }}
    org.opencadc.argus.uws.username = {{ required "application.uws.username" .username }}
    org.opencadc.argus.uws.password = {{ required "application.uws.password" .password }}
    {{- end }}

    {{- with $app.tapadm }}
    org.opencadc.argus.tapadm.maxActive = {{ .maxActive | default 2 }}
    org.opencadc.argus.tapadm.username = {{ required "application.tapadm.username" .username }}
    org.opencadc.argus.tapadm.password = {{ required "application.tapadm.password" .password }}
    org.opencadc.argus.tapadm.url = {{ required "application.tapadm.url" .url }}
    {{- end }}

    {{- with $app.query }}
    org.opencadc.argus.query.maxActive = {{ .maxActive | default 2 }}
    org.opencadc.argus.query.username = {{ required "application.query.username" .username }}
    org.opencadc.argus.query.password = {{ required "application.query.password" .password }}
    org.opencadc.argus.query.url = {{ required "application.query.url" .url }}
    {{- end }}
  argus.properties: |
    {{- with $app.materializedViews }}
    {{- if .enabled }}
    org.opencadc.argus.enableMaterializedViews = {{ .enabled }}
    {{- end }}
    {{- end }}
  cadc-tap-tmp.properties: |
    org.opencadc.tap.tmp.StorageManager = {{ $app.tapTmp.storageManager | default "org.opencadc.tap.tmp.TempStorageManager" }}
    {{- $resultsBase := $app.tapTmp.baseURL -}}
    {{- if not $resultsBase }}
    {{- $resultsBase = printf "https://%s/%s/results" $hostname $ctx -}}
    {{- end }}
    org.opencadc.tap.tmp.TempStorageManager.baseURL = {{ $resultsBase }}
    org.opencadc.tap.tmp.TempStorageManager.baseStorageDir = {{ $app.tapTmp.baseStorageDir | default "/tmp" }}