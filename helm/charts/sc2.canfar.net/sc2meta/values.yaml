# CAOM metadata service (MAQ) — https://github.com/opencadc/caom2sandbox/tree/main/sc2meta#configuration
#
# Runtime files are mounted under /config (ConfigMap + projected cookie-signing Secret).
# Stack-wide settings use global.* (set once on the parent stack chart). Per-service overrides use application.*.

replicaCount: 1

image:
  repository: images.opencadc.org/caom2/sc2meta
  pullPolicy: Always
  tag: "0.9.5"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /sc2meta
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sc2meta

resources: {}

livenessProbe:
  httpGet:
    path: /sc2meta/availability?detail=min
    port: http
readinessProbe:
  httpGet:
    path: /sc2meta/availability
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

global:
  proxyPort: 443
  registryUrls: []
  gmsId: ""
  cdpId: ""
  auth:
    identityManager: ca.nrc.cadc.ac.ACIdentityManager
    enableClientCertHeader: true
  cookieSignaturePublicKey:
    existingSecret:
      name: ""
      key: RsaSignaturePub.key
      path: RsaSignaturePub.key
  logging:
    users: []
    usernames: []
    groups: []
    secret:
      existingSecret:
        name: ""
        key: secret

application:
  contextPath: sc2meta
  uws: {}