# Advanced Search UI — https://github.com/opencadc/caom2ui/tree/main/advanced-search
#
# Runtime files are mounted under /config (ConfigMap + projected Secrets).
# Stack-wide settings use global.* (set once on the parent stack chart). Per-service overrides use application.*.

replicaCount: 1

image:
  repository: bucket.canfar.net/advanced-search
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "2.1.0-20260303T191134"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /AdvancedSearch
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /AdvancedSearch

resources: {}

# Default WAR context is AdvancedSearch (see advanced-search integration tests).
livenessProbe:
  httpGet:
    path: /AdvancedSearch/
    port: http
readinessProbe:
  httpGet:
    path: /AdvancedSearch/
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

global:
  proxyPort: 443
  registryUrls: []
  gmsId: ""
  cdpId: ""
  auth:
    identityManager: ca.nrc.cadc.ac.ACIdentityManager
    enableClientCertHeader: true
  cookieSignaturePublicKey:
    existingSecret:
      name: ""
      key: RsaSignaturePub.key
      path: RsaSignaturePub.key
  logging:
    users: []
    usernames: []
    groups: []
    secret:
      existingSecret:
        name: ""
        key: secret

application:
  contextPath: AdvancedSearch
  tapServiceId: ""
  # UWS job persistence (advancedsearch.uws.* in catalina.properties).
  uws: {}
  # Extra org.opencadc.search.properties entries (full property keys).
  searchProperties: {}
  # Optional servops/tmpops client certs projected into /config.
  clientCertificates:
    existingSecret:
      name: ""
      items: []
      # - key: cadcproxy.pem
      #   path: cadcproxy.pem
      # - key: tmpops.pem
      #   path: tmpops.pem