env:
  PREPARE_DATA_APPROACH: copy_to_user_area
  ABS_PATH_USER_AREA_ROOT: /users/cavern/home
  ABS_PATH_RSE_ROOT: /rse_data/deterministic
  ABS_PATH_CELERY_RESULTS: /var/celery/results

pvc:
  rse: "rse-pvc"
  rsePath: "/rse_data"
  cavern: "cavern-pvc"
  cavernPath: "/users/cavern/home"
  celeryCache: "celery-pvc"
  celeryCachePath: "/var/celery/results"
