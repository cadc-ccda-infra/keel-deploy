apiVersion: v1
kind: Service
metadata:
  labels:
    app: core
  name: core
  namespace: {{ .Release.Namespace }}
spec:
  {{- with .Values.service }}
  {{- if .type }}
  type: {{ .type }}
  {{- end }}
  ports:
    - name: "{{ .port }}"
      port: {{ .port }}
      targetPort: {{ .port }}
  {{- end }}
  selector:
    app: core
