apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: core
  name: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core
  strategy: {}
  template:
    metadata:
      labels:
        app: core
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "api.serviceAccountName" .Values }}
      containers:
      - name: ska-src-dm-local-data-preparer-core
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ .Values.localPreparerCore.image.registry }}/{{ .Values.localPreparerCore.image.image }}:{{ .Values.localPreparerCore.image.tag }}"
        imagePullPolicy: {{ .Values.localPreparerCore.image.pullPolicy }}
        env:
          - name: CELERY_BROKER_URL
            value: "amqp://guest@rabbitmq.{{ .Release.Namespace }}.svc.{{ .Values.rabbitmqService.domain }}//"
          {{- range $key, $value := .Values.env }}
          - name: {{ $key }}
            value: "{{ $value }}"
          {{- end }}
        ports:
          - containerPort: 8000
        volumeMounts:
          - name: rse
            mountPath: "{{ .Values.pvc.rsePath }}"
          - name: cavern
            mountPath: "{{ .Values.pvc.cavernPath }}"
          - name: celery-cache
            mountPath: "{{ .Values.pvc.celeryCachePath }}"
      {{- with .Values.localPreparerCore.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.localPreparerCore.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: rse
          persistentVolumeClaim:
            claimName: "{{ .Values.pvc.rse }}"
        - name: cavern
          persistentVolumeClaim:
            claimName: "{{ .Values.pvc.cavern }}"
        - name: celery-cache
          persistentVolumeClaim:
            claimName: "{{ .Values.pvc.celeryCache }}"

      restartPolicy: Always

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
