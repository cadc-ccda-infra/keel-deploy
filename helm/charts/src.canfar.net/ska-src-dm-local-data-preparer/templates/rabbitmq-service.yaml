apiVersion: v1
kind: Service
metadata:
  labels:
    app: rabbitmq
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
spec:
{{- with .Values.rabbitmqService }}
{{- if .type }}
  type: {{ .type }}
{{- end }}
  ports:
  - name: "{{ .port }}"
    port: {{ .port }}
    targetPort: {{ .port }}
  selector:
    app: rabbitmq
{{- end }}