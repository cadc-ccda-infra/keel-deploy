deployment:
  hostname: staging-src.canfar.net
  storageUI:
    registryURL:
      - "https://staging.canfar.net/reg"
      - "https://spsrc27.iaa.csic.es/reg"
      - "https://reg.swesrc.chalmers.se"

    extraEnv:
      - name: CATALINA_OPTS
        value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:5555"

    theme:
      logoURL: https://staging-src.canfar.net/science-portal/images/canSRCLogo.png

    oidc:
      redirectURI: https://staging-src.canfar.net/storage/oidc-callback
      callbackURI: https://staging-src.canfar.net/storage/list
      uri: https://ska-iam.stfc.ac.uk/
      clientID: 551f1415-60d7-42a5-a977-11fd69700fe0
      scope: "openid profile offline_access"
      clientSecret:
        # Just re-use the same secret as for the science-portal.
        existingSecret: science-portal-oidc-secret-staging-src
        secretKey: oidc-client-secret
