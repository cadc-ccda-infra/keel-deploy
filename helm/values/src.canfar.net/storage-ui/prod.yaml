deployment:
  hostname: src.canfar.net
  storageUI:
    registryURL:
      - "https://reg.swesrc.chalmers.se"
      - "https://spsrc27.iaa.csic.es/reg"

    theme:
      logoURL: https://src.canfar.net/science-portal/images/canSRCLogo.png

    backend:
      defaultService: cavern
      services:
        cavern:
          resourceID: "ivo://canfar.net/src/cavern"
          nodeURIPrefix: "vos://canfar.net~src~cavern"
          userHomeDir: "/home"
          features:
            batchDownload: true
            batchUpload: false
            externalLinks: false
            paging: false

    oidc:
      redirectURI: https://src.canfar.net/storage/oidc-callback
      callbackURI: https://src.canfar.net/storage/list
      uri: https://ska-iam.stfc.ac.uk/
      clientID: 551f1415-60d7-42a5-a977-11fd69700fe0
      scope: "openid profile offline_access"
      clientSecret:
        existingSecret: science-portal-oidc-secret-src
        secretKey: oidc-client-secret
