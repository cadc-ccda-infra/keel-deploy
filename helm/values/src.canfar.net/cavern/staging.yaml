deployment:
  hostname: staging-src.canfar.net
  cavern:
    imagePullPolicy: Always
    image: images.opencadc.org/platform/cavern:0.10.4
    posixMapperResourceID: "https://staging-src.canfar.net/posix-mapper"
    resourceID: "ivo://canfar.net/staging-src/cavern"

    registryURL:
      - "https://staging-src.canfar.net/reg"

    loggingGroups:
      - "ivo://skao.int/gms?roles/prod/user"

    filesystem:
      dataDir: "/data"
      subPath: "cavern"
      rootOwner:
        adminUsername: "canfarops"
        username: "canfarops"
        uid: 10023
        gid: 10023

    uws:
      db:
        install: false
        maxActive: 6
        url: "jdbc:postgresql://quokka.canfar.net:8601/arcdb"
        auth:
          existingSecret: cavern-uws-db-auth
        # Postgres User default in the postgres:13 image
        runUID: 999

storage:
  service:
    spec:
      persistentVolumeClaim:
        claimName: canfar-src-cavern-pvc
