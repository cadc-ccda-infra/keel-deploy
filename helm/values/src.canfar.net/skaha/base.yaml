# Shared defaults for Skaha (opencadc platform chart).  API hostname, POSIX mapper URL,
# and sessions hostname: prod.yaml / staging.yaml.

kubernetesClusterDomain: keel-prod.local

replicaCount: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 8675309
  runAsGroup: 8675309
  fsGroup: 8675309
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

autoscaling:
  minReplicas: 1
  maxReplicas: 1

# Chart default readiness uses /skaha/availability every 15s with no timeout (kube default 1s).
# detail=min → heartbeat only; longer period and timeout avoid NotReady flapping under load.
readinessProbe:
  httpGet:
    path: /skaha/availability?detail=min
    port: http
  periodSeconds: 120
  timeoutSeconds: 30
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /skaha/availability
    port: http
  periodSeconds: 60
  timeoutSeconds: 30
  failureThreshold: 3

deployment:
  skaha:
    imagePullPolicy: Always
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          preference:
            matchExpressions:
              - key: skaha.opencadc.org/node-type
                operator: In
                values:
                  - service-node
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.count
                operator: DoesNotExist

    defaultQuotaGB: "100"

    headlessGroup: "ivo://skao.int/gms?roles/prod/user"
    headlessPriorityGroup: "ivo://skao.int/gms?roles/prod/user"
    headlessPriorityClass: "uber-user-preempt-high"

    loggingGroups:
      - "ivo://skao.int/gms?roles/prod/user"

    oidcURI: https://ska-iam.stfc.ac.uk/

    gmsID: ivo://skao.int/gms

    imageCache:
      refreshSchedule: "*/15 * * * *"

    posixMapperCacheTTLSeconds: "600"

    # The IdentityManager class handling authentication.  This should generally be left alone
    identityManagerClass: org.opencadc.auth.StandardIdentityManager

    sessions:
      expirySeconds: "345600"
      maxCount: "3"
      minEphemeralStorage: "20Gi"
      maxEphemeralStorage: "300Gi"
      nodeLabelSelector: "skaha.opencadc.org/node-type=worker-node"

      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: skaha.opencadc.org/node-type
                  operator: NotIn
                  values:
                    - service-node

      extraVolumes:
        - name: cvmfs
          volume:
            type: HOST_PATH
            hostPath: "/cvmfs/"
            hostPathType: Directory
          volumeMount:
            mountPath: "/cvmfs"
            readOnly: true
            mountPropagation: HostToContainer

    resources:
      limits:
        cpu: "4"
        memory: 8Gi
      requests:
        cpu: "2"
        memory: 2Gi

    priorityClass:
      name: uber-user-preempt-high
      create: false

experimentalFeatures:
  enabled: false

secrets: {}

redis:
  networkPolicy:
    enabled: false
  serviceAccount:
    create: false
  master:
    serviceAccount:
      create: false
    livenessProbe:
      timeoutSeconds: 20
      periodSeconds: 10
      failureThreshold: 6
    readinessProbe:
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 6
