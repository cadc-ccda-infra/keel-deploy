deployment:
  hostname: src.canfar.net
  skaha:
    registryURL:
      - "https://reg.swesrc.chalmers.se"
      - "https://spsrc27.iaa.csic.es/reg"

    posixMapperResourceID: "https://src.canfar.net/posix-mapper"
    sessions:
      hostname: workloads.canfar.net
      namespace: 
        name: canfar-src-workloads
        create: false

      userStorage:
        spec:
          persistentVolumeClaim:
            claimName: src-workloads-pvc

      limitRange:
        enabled: true
        rbac:
          create: true
        spec:
          max:
            memory: "96Gi"
            cpu: "8"
            nvidia.com/gpu: "2"
          default:
            memory: "12Gi"
            cpu: "2"
            nvidia.com/gpu: "0"
          defaultRequest:
            memory: "4Gi"
            cpu: "1"
            nvidia.com/gpu: "0"

rbac:
  # Whether to create RBAC roles and bindings for Skaha.  Defaults to true.
  create: true

  # Node-capacity ClusterRole is unused for platform stats (Metrics backend owns
  # cluster totals). Capsule also cannot create cluster-scoped roles here.
  # Keep false; do not re-enable for stats.
  clusterRole:
    create: false