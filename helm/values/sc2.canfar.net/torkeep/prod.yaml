global:
  registryUrls:
    - https://sc2.canfar.net/reg
  gmsId: "ivo://cadc.nrc.ca/gms"
  cdpId: "ivo://cadc.nrc.ca/cred"
  cookieSignaturePublicKey:
    existingSecret:
      name: cadc-sandbox-cookie-signature-public-key
      key: RsaSignaturePub.key
      path: RsaSignaturePub.key

application:
  caom2Metadata:
    url: jdbc:postgresql://quokka.canfar.net:5432/caom2
    username: caom2
    password: caom2pw
  grantProviders:
    - "ivo://cadc.nrc.ca/global/baldur"
  collections:
    - name: SANDBOX
      basePublisherID: "ivo://cadc.nrc.ca/sc2"
      computeMetadata: true
      proposalGroup: false

podLabels:
  app.kubernetes.io/part-of: sc2.canfar.net

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: sc2.canfar.net
      paths:
        - path: /sc2repo
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /sc2repo/availability?detail=min
    port: http

readinessProbe:
  httpGet:
    path: /sc2repo/availability
    port: http

startupProbe:
  httpGet:
    path: /sc2repo/availability?detail=min
    port: http