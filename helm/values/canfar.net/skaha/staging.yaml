kubernetesClusterDomain: keel-prod.local

# Scaled to zero for a short outage. Quote 0: Helm `default` treats an unquoted 0
# as empty, so replicaCount would become 1 and the HPA bounds would become 2 and 6.
# The HPA stays disabled because Kubernetes rejects maxReplicas 0.
# Restore replicaCount, minReplicas, and maxReplicas to 3 and delete enabled.
replicaCount: "1"

# Optional science-platform Metrics API (same Helm release as Skaha).
# When enabled, the chart injects SKAHA_METRICS_BACKEND_URL on Tomcat so
# GET /v1/session?view=stats reads capacity and allocated from
# GET /apis/canfar.net/v1alpha1/metrics/platform/canfar.
# ClusterQueues `cadc` and `src` match
# keel-deploy/manifests/kueue/clusterQueues/prod.cadc.yml and prod.src.yml.
# Session and user reads stay in this release's session namespace.
# METRICS_REDIS_URL comes from this release's Bitnami Redis
# (metricsBackend.redis.enabled, chart default true).
# Names follow science-platform/metrics docs/environment-contracts.md.
#
# Capsule on keel-prod forbids chart-managed ClusterRole/ClusterRoleBinding
# (create dry-run → Forbidden via capsule-proxy). Keep rbac.enabled false; do
# not flip it. ClusterQueue get/list for SA canfar-skaha-staging is ambient /
# pre-provisioned outside this release (track under Jira "Managed K8s Issues").
metricsBackend:
  enabled: true
  rbac:
    enabled: false
  image:
    # v0.1.6 and later reject retired METRICS_* names. v0.1.7 is the current image.
    tag: v0.1.7
  env:
    METRICS_PLATFORM_NAME: "canfar"
    # Must match the Mimir series label cluster on this cluster.
    METRICS_CLUSTER_NAME: "keel-prod"
    METRICS_PROVIDERS__KUEUE__CLUSTER_QUEUES: '["cadc","src"]'
    METRICS_PROVIDERS__KUEUE__NAMESPACES: '["canfar-staging-workloads"]'
    # Metrics appends /api/v1/query. Multitenancy is off, so no tenant header.
    METRICS_PROVIDERS__PROMQL__BASE_URL: "http://mimir-distributed-gateway.monitoring.svc/prometheus"
    # Cache integrity key. Chart 1.8.1 renders metricsBackend.env as literal env.
    METRICS_CACHE__KEY_SECRET: "do45TQ9ctvD_Ii0cS_R4Tvx94AEasnPrbD_gVE3-UxU"
    # Chart telemetry.metrics stays false; Metrics OTEL is this env block.
    # Prometheus 3.x OTLP receiver: :4318 is closed; use :9090/api/v1/otlp/v1/metrics.
    METRICS_OTEL__METRICS_ENABLED: "true"
    METRICS_OTEL__SERVICE_NAME: "skaha-metrics"
    METRICS_OTEL__EXPORTER_OTLP_ENDPOINT: "http://prometheus-operated.monitoring.svc:9090/api/v1/otlp/v1/metrics"
    METRICS_OTEL__EXPORT_INTERVAL_MILLIS: "60000"
    METRICS_OTEL__DEPLOYMENT_ENVIRONMENT: "staging"
    METRICS_OTEL__KUBERNETES_NAMESPACE: "canfar-system-staging"

# Skaha Tomcat OTEL metrics (chart skaha >= 1.6.1). Same Prometheus OTLP
# receiver as Metrics above: Java agent uses the OTLP base URL and appends
# /v1/metrics; Metrics Python exporter is given the full metrics path.
# telemetry.metrics stays false in this chart version (reserved).
telemetry:
  controller: true
  metrics: false
  otlp:
    destination: "http://prometheus-operated.monitoring.svc:9090/api/v1/otlp"
    interval: 60

autoscaling:
  enabled: false
  minReplicas: "0"
  maxReplicas: "0"

deployment:
  hostname: staging.canfar.net

  skaha:
    image: images-integration.canfar.net/skaha-system/skaha:2026.3-rc.2
    imagePullPolicy: Always
    registryURL:
      - https://staging.canfar.net/reg

    registryHosts: "images-integration.canfar.net"

    sessions:
      hostname: workloads.canfar.net
      namespace: 
        name: canfar-staging-workloads
        create: true
      userStorage:
        nodeURIPrefix: "vos://cadc.nrc.ca~arc"
        spec:
          persistentVolumeClaim:
            claimName: canfar-workloads-staging-pvc
      kueue:
        rbac:
          create: true
        default:
          queueName: "cadc-default"
          priorityClass: "high"
        headless:
          queueName: "cadc-default"
          priorityClass: "low"

      # Values that represent boundaries for the session resources.  Tune to your Cluster's capacity.
      limitRange:
        enabled: true
        rbac:
          create: true
        spec:
          # -- max is the maximum allowed requested for 'fixed' User Sessions.
          max:
            memory: "192Gi"
            cpu: "16"
            nvidia.com/gpu: "7"
          # -- default is the default limits for 'flex' User Sessions.  These Sessions will grow until this limit is reached.
          default:
            memory: "32Gi"
            cpu: "16"
            nvidia.com/gpu: "0"
          # -- defaultRequest is the default requests for 'flex' User Sessions.  All flex sessions will start with this request.
          defaultRequest:
            memory: "4Gi"
            cpu: "1"
            nvidia.com/gpu: "0"

      authorization:
        group:
          enabled: true
          uri: "ivo://cadc.nrc.ca/gms?skaha-users"

rbac:
  # Whether to create RBAC roles and bindings for Skaha.  Defaults to true.
  create: true

  # Node-capacity ClusterRole is unused for platform stats (Metrics backend owns
  # cluster totals). Capsule also cannot create cluster-scoped roles here.
  # Keep false; do not re-enable for stats.
  clusterRole:
    create: false

serviceAccount:
  create: true
