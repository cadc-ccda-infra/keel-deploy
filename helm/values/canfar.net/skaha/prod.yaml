kubernetesClusterDomain: keel-prod.local

# Scaled to zero for a short outage. Quote 0: Helm `default` treats an unquoted 0
# as empty, so replicaCount would become 1 and the HPA bounds would become 2 and 6.
# The HPA stays disabled because Kubernetes rejects maxReplicas 0.
# Restore replicaCount, minReplicas, and maxReplicas to 3 and delete enabled.
replicaCount: "3"

# Optional science-platform Metrics API (same Helm release as Skaha).
# When enabled, the chart injects SKAHA_METRICS_BACKEND_URL on Tomcat so
# GET /v1/session?view=stats (platform stats) reads capacity/allocated from
# Metrics GET /api/v1/metrics/platform — not from node listing.
# Kueue alignment: ClusterQueues `cadc` and `src` (cohort `canfar`) — see
# keel-deploy/manifests/kueue/clusterQueues/prod.cadc.yml,
# keel-deploy/manifests/kueue/clusterQueues/prod.src.yml,
# keel-deploy/manifests/kueue/clusterQueues/prod.cohorts.yml, and
# keel-deploy/manifests/kueue/controller/controller.config.yml
# (METRICS_* names follow science-platform/metrics docs/environment-contracts.md).
# METRICS_REDIS_URL is injected by the Skaha chart from this release's Bitnami Redis when metricsBackend.redis.enabled is true.
# METRICS_ENVIRONMENT is set per Argo overlay (staging.yaml, integration.yaml, prod.yaml) to match the deployment hostname tier.
#
# Capsule on keel-prod forbids chart-managed ClusterRole/ClusterRoleBinding
# (create dry-run → Forbidden via capsule-proxy). Keep rbac.enabled false; do
# not flip it. ClusterQueue get/list for SA canfar-skaha-prod is ambient /
# pre-provisioned outside this release (track under Jira "Managed K8s Issues").
metrics:
  platformName: canfar
  # Must match the Mimir/Prometheus series label on this cluster.
  clusterName: keel-prod
  rbac:
    enabled: false
    namespaces:
      - canfar-staging-workloads
  image:
    repository: images.opencadc.org/platform/metrics
    tag: v0.1.7
  # Chart >= 1.10.1 always allows this namespace (Redis) and DNS on port 53.
  # Cilium ignores ipBlock for the kubernetes ClusterIP and matches the API
  # server after Service translation, so allow its endpoint port (6443).
  # Mimir and the Prometheus OTLP receiver live in the monitoring namespace.
  networkPolicy:
    egress:
      kubeApiServer:
        - ports:
            - port: 6443
              protocol: TCP
      promql:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
      otlp:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
  prometheus:
    url: "http://mimir-distributed-gateway.monitoring.svc/prometheus"
  otlp:
    # Prometheus 3.x OTLP receiver: :4318 is closed; use :9090 path.
    endpoint: "http://prometheus-operated.monitoring.svc:9090/api/v1/otlp/v1/metrics"
  env:
    METRICS_PROVIDERS__KUEUE__CLUSTER_QUEUES: '["cadc","src"]'
    # Chart telemetry.metrics stays false; remaining OTEL identity via env.
    METRICS_OTEL__SERVICE_NAME: "skaha-metrics"
    METRICS_OTEL__EXPORT_INTERVAL_MILLIS: "60000"
    METRICS_OTEL__DEPLOYMENT_ENVIRONMENT: "production"
    METRICS_OTEL__KUBERNETES_NAMESPACE: "canfar-system-production"

# Skaha Tomcat OTEL metrics (chart skaha >= 1.6.1). Same Prometheus OTLP
# receiver as Metrics above: Java agent uses the OTLP base URL and appends
# /v1/metrics; Metrics Python exporter is given the full metrics path.
# telemetry.metrics stays false in this chart version (reserved).
telemetry:
  controller: true
  metrics: false
  otlp:
    destination: "http://prometheus-operated.monitoring.svc:9090/api/v1/otlp"
    interval: 60

autoscaling:
  enabled: false
  minReplicas: "0"
  maxReplicas: "0"

deployment:
  hostname: ws-uv.canfar.net

  skaha:
    imagePullPolicy: Always
    registryURL:
      - https://cadc-west-01.canfar.net/reg

    cookieSignaturePublicKey:
      existingSecret:
        name: cookie-signature-public-key
        path: RsaSignaturePub.key

    sessions:
      hostname: workloads.canfar.net
      namespace: 
        name: canfar-workloads
        create: true
      userStorage:
        nodeURIPrefix: "vos://cadc.nrc.ca~arc"
        spec:
          persistentVolumeClaim:
            claimName: canfar-workloads-production-pvc
      kueue:
        rbac:
          create: true
        default:
          queueName: "cadc-default"
          priorityClass: "high"
        headless:
          queueName: "cadc-default"
          priorityClass: "low"

      # Values that represent boundaries for the session resources.  Tune to your Cluster's capacity.
      limitRange:
        enabled: true
        rbac:
          create: true
        spec:
          # -- max is the maximum allowed requested for 'fixed' User Sessions.
          max:
            memory: "192Gi"
            cpu: "16"
            nvidia.com/gpu: "7"
          # -- default is the default limits for 'flex' User Sessions.  These Sessions will grow until this limit is reached.
          default:
            memory: "32Gi"
            cpu: "16"
            nvidia.com/gpu: "0"
          # -- defaultRequest is the default requests for 'flex' User Sessions.  All flex sessions will start with this request.
          defaultRequest:
            memory: "4Gi"
            cpu: "1"
            nvidia.com/gpu: "0"

      minEphemeralStorage: "20Gi"
      maxEphemeralStorage: "300Gi"

      authorization:
        group:
          enabled: true
          uri: "ivo://cadc.nrc.ca/gms?skaha-users"

rbac:
  # Whether to create RBAC roles and bindings for Skaha.  Defaults to true.
  create: true

  # Node-capacity ClusterRole is unused for platform stats (Metrics backend owns
  # cluster totals). Capsule also cannot create cluster-scoped roles here.
  # Keep false; do not re-enable for stats.
  clusterRole:
    create: false

serviceAccount:
  create: true
