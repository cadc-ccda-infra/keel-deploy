# Production overlay — DataCite MDS and vault DOI parent, aligned with
# bucket/deployments/canfar-rc/doi/rc/config/doi.properties (RC), adapted for
# ws-uv.canfar.net (landing via the production citation UI on www.canfar.net).

ingress:
  hosts:
    - host: ws-uv.canfar.net
      paths:
        - path: /doi
          pathType: Prefix

imagePullSecrets:
  - name: bucket-registry-auth

application:
  registryURL: https://cadc-west-01.canfar.net/reg

  config:
    vospaceParentUri: vos://cadc.nrc.ca~vault/AstroDataCitationDOI/CISTI.CANFAR
    groupPrefix: DOI-
    landingUrl: https://www.canfar.net/citation/landing
    mdsUrl: https://mds.datacite.org
    accountPrefix: "10.11570"

  cookieSignaturePublicKey:
    existingSecret:
      name: cookie-signature-public-key
      path: RsaSignaturePub.key

        # Mount the pre-auth service account PEM
  extraVolumeMounts:
    - mountPath: /usr/share/tomcat/.ssl/cadcproxy.pem
      subPath: cadcproxy.pem
      name: servops-cert
      readOnly: true
    - mountPath: /usr/share/tomcat/.ssl/doiadmin.pem
      subPath: doiadmin.pem
      name: doiadmin-cert
      readOnly: true

  # Create the CA certificate volume to be mounted in extraVolumeMounts
  extraVolumes:
    - name: servops-cert
      secret:
        defaultMode: 420
        secretName: servops-clientcert
    - name: doiadmin-cert
      secret:
        defaultMode: 420
        secretName: doiadmin-clientcert

livenessProbe:
  httpGet:
    path: /doi/availability
    port: http
  periodSeconds: 40
  timeoutSeconds: 40

readinessProbe:
  httpGet:
    path: /doi/availability
    port: http
  periodSeconds: 40
  timeoutSeconds: 40

startupProbe:
  httpGet:
    path: /doi/availability
    port: http
  initialDelaySeconds: 10
  timeoutSeconds: 40
  periodSeconds: 40
  failureThreshold: 30
