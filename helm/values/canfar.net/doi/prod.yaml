# Production overlay — DataCite MDS and vault DOI parent, aligned with
# bucket/deployments/canfar-rc/doi/rc/config/doi.properties (RC), adapted for
# ws-cadc.canfar.net (landing via the production citation UI on www.canfar.net).

ingress:
  hosts:
    - host: ws-cadc.canfar.net
      paths:
        - path: /doi
          pathType: Prefix

imagePullSecrets:
  - name: bucket-registry-auth

application:
  registryURL: https://cadc-west-01.canfar.net/reg

  config:
    vospaceParentUri: vos://cadc.nrc.ca~vault/AstroDataCitationDOI/CISTI.CANFAR
    groupPrefix: DOI-
    landingUrl: https://www.canfar.net/citation/landing
    mdsUrl: https://mds.datacite.org
    accountPrefix: "10.11570"

  cookieSignaturePublicKey:
    existingSecret:
      name: cookie-signature-public-key
      path: RsaSignaturePub.key

livenessProbe:
  httpGet:
    path: /doi/availability
    port: http
  periodSeconds: 40
  timeoutSeconds: 40

readinessProbe:
  httpGet:
    path: /doi/availability
    port: http
  periodSeconds: 40
  timeoutSeconds: 40

startupProbe:
  httpGet:
    path: /doi/availability
    port: http
  initialDelaySeconds: 10
  timeoutSeconds: 40
  periodSeconds: 40
  failureThreshold: 30
