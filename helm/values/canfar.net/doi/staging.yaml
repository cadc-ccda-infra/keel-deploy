# Staging overlay — DataCite test MDS and vault DOItest parent, aligned with
# bucket/deployments/canfar-rc/doi/rc/config/doi.properties (RC), adapted for
# staging.canfar.net (landing via the staging citation UI).

ingress:
  hosts:
    - host: staging.canfar.net
      paths:
        - path: /doi
          pathType: Prefix

imagePullSecrets:
  - name: bucket-registry-auth

# Mount the pre-auth service account PEM
volumeMounts:
  - mountPath: /usr/share/tomcat/.ssl/
    name: servops-cert
    readOnly: true
  - mountPath: /usr/share/tomcat/.ssl/
    name: doiadmin-cert
    readOnly: true

# Create the CA certificate volume to be mounted in extraVolumeMounts
volumes:
  - name: servops-cert
    secret:
      defaultMode: 420
      secretName: servops-clientcert
  - name: doiadmin-cert
    secret:
      defaultMode: 420
      secretName: doiadmin-clientcert

application:
  registryURL: https://staging.canfar.net/reg
  config:
    vospaceParentUri: vos://cadc.nrc.ca~vault/DOItest/doi
    groupPrefix: TEST.DOI-
    landingUrl: https://staging.canfar.net/citation/landing
    mdsUrl: https://mds.test.datacite.org
    accountPrefix: "10.80791"
    randomTestID: true

  cookieSignaturePublicKey:
    existingSecret:
      name: canfar-skaha-staging-cookie-signature-public-key
      path: RsaSignaturePub.key

livenessProbe:
  httpGet:
    path: /doi/availability
    port: http
  periodSeconds: 40
  timeoutSeconds: 40

readinessProbe:
  httpGet:
    path: /doi/availability
    port: http
  periodSeconds: 40
  timeoutSeconds: 40

startupProbe:
  httpGet:
    path: /doi/availability
    port: http
  initialDelaySeconds: 10
  timeoutSeconds: 40
  periodSeconds: 40
  failureThreshold: 30
