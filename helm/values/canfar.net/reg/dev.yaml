global:
  hostname: dev.canfar.net

application:
  identityManagerClass: ca.nrc.cadc.ac.ACIdentityManager
  rsaSignaturePublicKey:
    existingSecret: "cookie-signature-public-key"

  # Identity (gms, ums, cred) uses the production CADC West stack; staging is not
  # reachable from keel-dev. Add dev.canfar.net entries (skaha, arc, ...) as each
  # service lands on keel-dev.
  serviceEntries:
    - id: "ivo://cadc.nrc.ca/reg"
      url: "https://dev.canfar.net/reg/capabilities"
    - id: "ivo://cadc.nrc.ca/gms"
      url: "https://cadc-west-01.canfar.net/ac/capabilities"
    - id: "ivo://cadc.nrc.ca/ums"
      url: "https://cadc-west-01.canfar.net/ac/capabilities"
    - id: "ivo://cadc.nrc.ca/cred"
      url: "https://cadc-west-01.canfar.net/cred/capabilities"
    - id: "ivo://cadc.nrc.ca/arc"
      url: "https://dev.canfar.net/arc/capabilities"

ingress:
  hosts:
    - host: dev.canfar.net
      paths:
        - path: /reg
          pathType: Prefix

imagePullSecrets:
  - name: bucket-registry-auth

# Optionally mount a custom CA certificate
volumeMounts:
  - mountPath: /usr/share/tomcat/.ssl/
    name: servops-cert
    readOnly: true

# Create the CA certificate volume to be mounted in extraVolumeMounts
volumes:
  - name: servops-cert
    secret:
      defaultMode: 420
      secretName: servops-clientcert