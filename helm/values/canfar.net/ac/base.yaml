# Shared defaults for the OpenCADC ac/GMS service.

image:
  repository: bucket.canfar.net/ac
  tag: "1.5.0-20260127T224241"
  pullPolicy: IfNotPresent

replicaCount: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 8675309
  runAsGroup: 8675309
  fsGroup: 8675309
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  runAsNonRoot: true
  runAsUser: 8675309
  runAsGroup: 8675309
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

application:
  endpoint: /ac
  resourceID: ivo://cadc.nrc.ca/gms
  runtimeConfig:
    existingSecret: ac-runtime-config
  readUsers: []
  domains: []
  groupNameRules: {}
  logging:
    users: []
    usernames: []
    groups:
      - "ivo://cadc.nrc.ca/gms?CADC"

  # Pre-create the runtimeConfig Secret in the destination namespace. It must
  # contain ac-ldap-config.properties. OIDC deployments also require the OIDC
  # client file and the oidc-rsa256 public/private key pair.

  resources:
    requests:
      memory: "500M"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "750m"

  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        preference:
          matchExpressions:
            - key: skaha.opencadc.org/node-type
              operator: In
              values:
                - service-node
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.count
              operator: DoesNotExist

livenessProbe:
  httpGet:
    path: /ac/availability
    port: http
  initialDelaySeconds: 10
  periodSeconds: 60
  timeoutSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ac/availability
    port: http
  initialDelaySeconds: 10
  periodSeconds: 60
  timeoutSeconds: 30
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /ac/availability
    port: http
  periodSeconds: 20
  timeoutSeconds: 30
  failureThreshold: 30
