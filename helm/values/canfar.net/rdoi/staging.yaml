# Staging overlay — DataCite test MDS and vault DOItest parent, aligned with
# bucket/deployments/canfar-rc/doi/rc/config/doi.properties (RC), adapted for
# staging.canfar.net (landing via the staging citation UI).

ingress:
  hosts:
    - host: staging.canfar.net
      paths:
        - path: /rdoi
          pathType: Prefix

imagePullSecrets:
  - name: bucket-registry-auth

application:
  registryURL: https://staging.canfar.net/reg

  config:
    publisherGroupURI: ivo://cadc.nrc.ca/gms?RAFTS-test-reviewers
    vospaceParentUri: vos://cadc.nrc.ca~vault/DOItest/rafts
    doiIdentifierPrefix: RAFTS-
    groupPrefix: TEST.DOI-
    landingUrl: https://staging.canfar.net/rafts/landing
    mdsUrl: https://mds.test.datacite.org
    accountPrefix: "10.80791"
    randomTestID: true

  cookieSignaturePublicKey:
    existingSecret:
      name: canfar-skaha-staging-cookie-signature-public-key
      path: RsaSignaturePub.key

  # Mount the pre-auth service account PEM
  extraVolumeMounts:
    - mountPath: /usr/share/tomcat/.ssl/cadcproxy.pem
      subPath: cadcproxy.pem
      name: servops-cert
      readOnly: true
    - mountPath: /usr/share/tomcat/.ssl/doiadmin.pem
      subPath: doiadmin.pem
      name: doiadmin-cert
      readOnly: true

  # Create the CA certificate volume to be mounted in extraVolumeMounts
  extraVolumes:
    - name: servops-cert
      secret:
        defaultMode: 420
        secretName: servops-clientcert
    - name: doiadmin-cert
      secret:
        defaultMode: 420
        secretName: doiadmin-clientcert

livenessProbe:
  httpGet:
    path: /rdoi/availability
    port: http
  periodSeconds: 40
  timeoutSeconds: 40

readinessProbe:
  httpGet:
    path: /rdoi/availability
    port: http
  periodSeconds: 40
  timeoutSeconds: 40

startupProbe:
  httpGet:
    path: /rdoi/availability
    port: http
  initialDelaySeconds: 10
  timeoutSeconds: 40
  periodSeconds: 40
  failureThreshold: 30
