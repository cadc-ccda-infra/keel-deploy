# CANFAR DOI — shared defaults; chart schema:
# https://images-rc.canfar.net/chartrepo/skaha-system (chart doi).
# Upstream source: /Users/jenkinsd/Projects/at88mph/doi/doi/helm
# (published as images-rc.canfar.net/chartrepo/skaha-system chart doi).
#
# image.repository / image.tag / image.pullPolicy: use the chart's values.yaml
# (released with each chart version) unless overridden per environment.
#
# Secrets (pre-create in the release namespace; credentials are not in Git):
#   - doi-datacite: username / password (DataCite MDS)
#   - doi-certs: doiadmin.pem / cadcproxy.pem

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 8675309
  runAsGroup: 8675309
  fsGroup: 8675309
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  runAsNonRoot: true
  runAsUser: 8675309
  runAsGroup: 8675309
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

replicaCount: 1

volumeInit:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 8675309
    capabilities:
      drop:
        - ALL

application:
  applicationName: rdoi
  identityManagerClass: ca.nrc.cadc.ac.ACIdentityManager
  gmsID: ivo://cadc.nrc.ca/gms
  oidcURI: ivo://cadc.nrc.ca/gms

  config:
    metaDataPrefix: CISTI_CADC_

  datacite:
    auth:
      existingSecret: doi-datacite

  loggingGroups:
    - "ivo://cadc.nrc.ca/gms?CADC"

  # Mount the pre-auth service account PEM
  extraVolumeMounts:
    - mountPath: /usr/share/tomcat/.ssl
      name: client-certs
      readOnly: true

  # Create the CA certificate volume to be mounted in extraVolumeMounts
  # This will combine the servops and doiadmin PEMs into a single volume
  # to avoid bind mounting the files and ignoring the secrets when they are patched.
  extraVolumes:
    - name: client-certs
      projected:
        sources:
          - secret:
              name: servops-clientcert
              items:
                - key: cadcproxy.pem
                  path: cadcproxy.pem
          - secret:
              name: doiadmin-clientcert
              items:
                - key: doiadmin.pem
                  path: doiadmin.pem

  extraEnv:
    - name: JAVA_TOOL_OPTIONS
      value: "-XX:-UseBASE64Intrinsics"

  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 50
      preference:
        matchExpressions:
        - key: skaha.opencadc.org/node-type
          operator: In
          values:
          - service-node
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: nvidia.com/gpu.count
          operator: DoesNotExist

ingress:
  enabled: true
  className: ""
  annotations: {}

serviceAccount:
  create: false
  automount: false
