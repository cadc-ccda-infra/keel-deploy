ingress:
  enabled: true
  hosts:
    - host: www.canfar.net
      paths:
        - path: /
          pathType: Prefix

# Service URLs injected at runtime (see ADVANCED_SEARCH_URL / GROUP_MANAGEMENT_URL).
advancedSearchUrl: "https://www.cadc-ccda.hia-iha.nrc-cnrc.gc.ca/en/search/"
groupManagementUrl: "https://www.cadc-ccda.hia-iha.nrc-cnrc.gc.ca/en/groups/"
certificateUrl: "https://cadc-west-01.canfar.net/cred/generate?daysValid=30"

service:
  port: 8000

imagePullSecrets:
  - name: bucket-registry-auth