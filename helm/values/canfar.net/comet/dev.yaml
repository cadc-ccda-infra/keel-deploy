# keel-dev values. COMET shares dev.canfar.net with other services under /comet.
# TLS terminates in front of the cluster, so the Ingress carries no TLS block.
ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: dev.canfar.net
  path: /comet
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

env:
  # Pins scheme, host, and path prefix; OAuth callbacks default to
  # https://dev.canfar.net/comet/oauth/{cadc,github,gitlab}/callback.
  COMET_PUBLIC_URL: https://dev.canfar.net/comet
  # Shared CADC sign-in stays off until COMET_MMP_CLIENT_SECRET is in comet-secrets.
  MMP_BASE_URL: https://staging.portal.candiapl.ca
  CADC_LOGIN_URL: https://cadc-west-01.canfar.net/ac/login
  CADC_OIDC_TOKEN_URL: https://cadc-west-01.canfar.net/ac/token
  CADC_OIDC_USERINFO_URL: https://cadc-west-01.canfar.net/ac/userinfo
  CADC_CRED_DELEGATION_HOST: cadc-west-01.canfar.net
  CADC_OIDC_CLIENT_ID: candiapl
  CANFAR_ARC_FILES_URL: https://ws-uv.canfar.net/arc/files
  CANFAR_ARC_NODES_URL: https://ws-uv.canfar.net/arc/nodes
