# CANFAR Data Citation — shared defaults; chart schema:
# https://images-rc.canfar.net/chartrepo/skaha-system (chart citation).
# Upstream source: https://github.com/opencadc/doi/tree/main/citation/helm
#
# image.repository / image.tag / image.pullPolicy: use the chart's values.yaml
# (released with each chart version) unless overridden per environment.

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 8675309
  runAsGroup: 8675309
  fsGroup: 8675309
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  runAsNonRoot: true
  runAsUser: 8675309
  runAsGroup: 8675309
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

replicaCount: 1

livenessProbe:
  httpGet:
    path: /citation/
    port: 8080
  initialDelaySeconds: 60

readinessProbe:
  httpGet:
    path: /citation/
    port: 8080
  initialDelaySeconds: 30

ingress:
  enabled: true
  className: ""
  annotations: {}

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 50
      preference:
        matchExpressions:
        - key: skaha.opencadc.org/node-type
          operator: In
          values:
          - service-node
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: nvidia.com/gpu.count
          operator: DoesNotExist
