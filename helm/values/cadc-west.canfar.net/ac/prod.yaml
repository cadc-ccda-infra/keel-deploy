# Production overlay — LDAP pool sizes and hosts from cadc-site ac,
# exposed on cadc-west-01.canfar.net.

ingress:
  hosts:
    - host: cadc-west-01.canfar.net
      paths:
        - path: /ac
          pathType: Prefix

image:
  tag: 1.5.1-20260917T193124

imagePullSecrets:
  - name: bucket-registry-auth

# LDAP hosts used by the existing CADC ac deployments; keep if cluster DNS
# does not resolve ns1-05 / ns1-06.
extraHosts:
  - hostname: quokka.canfar.internal
    ip: 206.12.48.218

replicaCount: 1

application:
  registryURL: https://cadc-west-01.canfar.net/reg

  ldap:
    port: 11636
    readOnly:
      servers: quokka.canfar.internal
      poolInitSize: 20
      poolMaxSize: 400
      secure: true
      port: 11636
    readWrite:
      servers: quokka.canfar.internal
      poolInitSize: 10
      poolMaxSize: 20
      secure: true
      port: 11636
    unboundReadOnly:
      servers: quokka.canfar.internal
      poolInitSize: 20
      poolMaxSize: 400
      secure: true
      port: 11636
