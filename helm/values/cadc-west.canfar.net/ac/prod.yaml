# Production overlay — LDAP pool sizes and hosts from cadc-site ac,
# exposed on cadc-west-01.canfar.net.

image:
  repository: bucket.canfar.net/ac
  pullPolicy: Always
  tag: 1.5.2-20261006T215953

ingress:
  hosts:
    - host: cadc-west-01.canfar.net
      paths:
        - path: /ac
          pathType: Prefix

imagePullSecrets:
  - name: bucket-registry-auth

resources:
  requests:
    cpu: 750m
    memory: 3000Mi
  limits:
    cpu: 2500m
    memory: 4000Mi

# LDAP hosts used by the existing CADC ac deployments; keep if cluster DNS
# does not resolve ns1-05 / ns1-06.
extraHosts:
  - hostname: quokka.canfar.internal
    ip: 206.12.48.218

replicaCount: 3

application:
  registryURL: https://cadc-west-01.canfar.net/reg

  ldap:
    port: 11636
    readOnly:
      servers: quokka.canfar.internal
      poolInitSize: 20
      poolMaxSize: 200
      secure: true
      port: 11636
    readWrite:
      servers: quokka.canfar.internal
      poolInitSize: 20
      poolMaxSize: 200
      secure: true
      port: 11636
    unboundReadOnly:
      servers: quokka.canfar.internal
      poolInitSize: 20
      poolMaxSize: 200
      secure: true
      port: 11636
