# Production overlay — LDAP pool sizes and hosts from cadc-site ac,
# exposed on cadc-west-01.canfar.net.

ingress:
  hosts:
    - host: cadc-west-01.canfar.net
      paths:
        - path: /ac
          pathType: Prefix

imagePullSecrets:
  - name: bucket-registry-auth

# LDAP hosts used by the existing CADC ac deployments; keep if cluster DNS
# does not resolve ns1-05 / ns1-06.
extraHosts:
  - ip: 132.246.195.16
    hostname: ns1-05.cadc.dao.nrc.ca
  - ip: 132.246.195.17
    hostname: ns1-06.cadc.dao.nrc.ca

replicaCount: 4

application:
  registryURL: https://cadc-west-01.canfar.net/reg

  ldap:
    readOnly:
      servers: ns1-05.cadc.dao.nrc.ca ns1-06.cadc.dao.nrc.ca
      poolInitSize: 20
      poolMaxSize: 400
      port: 389
    readWrite:
      servers: ns1-05.cadc.dao.nrc.ca ns1-06.cadc.dao.nrc.ca
      poolInitSize: 10
      poolMaxSize: 20
      port: 636
    unboundReadOnly:
      servers: ns1-05.cadc.dao.nrc.ca ns1-06.cadc.dao.nrc.ca
      poolInitSize: 20
      poolMaxSize: 400
      port: 389
