# Staging overlay — LDAP pool sizes and hosts from cadc-rc ac,
# exposed on staging-cadc-west-01.canfar.net.

ingress:
  hosts:
    - host: staging-cadc-west-01.canfar.net
      paths:
        - path: /ac
          pathType: Prefix

imagePullSecrets:
  - name: bucket-registry-auth

replicaCount: 1

application:
  registryURL: https://staging-cadc-west-01.canfar.net/reg

  ldap:
    readOnly:
      servers: quokka.canfar.net
      poolInitSize: 4
      poolMaxSize: 10
      port: 10636
      secure: true
    readWrite:
      servers: quokka.canfar.net
      poolInitSize: 3
      poolMaxSize: 5
      port: 10636
      secure: true
    unboundReadOnly:
      servers: quokka.canfar.net
      secure: true
      poolInitSize: 1
      poolMaxSize: 10
      port: 10636
