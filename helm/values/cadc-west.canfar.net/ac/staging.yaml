# Staging overlay — LDAP pool sizes and hosts from cadc-rc ac,
# exposed on staging-cadc-west-01.canfar.net.

securityContext:
  # cadc-tomcat uses sudo as 8675309 to import PEMs from /config/cacerts
  # into the JVM trust store. allowPrivilegeEscalation: false sets
  # no_new_privs and blocks that.
  allowPrivilegeEscalation: true

ingress:
  hosts:
    - host: staging-cadc-west-01.canfar.net
      paths:
        - path: /ac
          pathType: Prefix

image:
  tag: 1.5.1-20260917T193124

imagePullSecrets:
  - name: bucket-registry-auth

replicaCount: 1

extraHosts:
  - hostname: quokka.canfar.internal
    ip: 206.12.48.218

application:
  registryURL: https://staging-cadc-west-01.canfar.net/reg

  ldap:
    readOnly:
      servers: quokka.canfar.internal
      poolInitSize: 4
      poolMaxSize: 10
      secure: true
      port: 10636
    readWrite:
      servers: quokka.canfar.internal
      poolInitSize: 3
      poolMaxSize: 5
      secure: true
      port: 10636
    unboundReadOnly:
      servers: quokka.canfar.internal
      poolInitSize: 1
      poolMaxSize: 10
      secure: true
      port: 10636
