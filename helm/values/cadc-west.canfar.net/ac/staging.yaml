# Staging overlay — LDAP pool sizes and hosts from cadc-rc ac,
# exposed on staging-cadc-west-01.canfar.net.

image:
  repository: at88mph/ac
  pullPolicy: Always
  tag: SNAPSHOT

ingress:
  hosts:
    - host: staging-cadc-west-01.canfar.net
      paths:
        - path: /ac
          pathType: Prefix

imagePullSecrets:
  - name: bucket-registry-auth

replicaCount: 2

resources:
  requests:
    cpu: 750m
    memory: 1000Mi
  limits:
    cpu: 2500m
    memory: 2000Mi

extraHosts:
  - hostname: quokka.canfar.internal
    ip: 206.12.48.218

application:
  registryURL: https://staging-cadc-west-01.canfar.net/reg

  ldap:
    port: 10636
    readOnly:
      servers: quokka.canfar.internal
      poolInitSize: 4
      poolMaxSize: 10
      secure: true
      port: 10636
    readWrite:
      servers: quokka.canfar.internal
      poolInitSize: 3
      poolMaxSize: 5
      secure: true
      port: 10636
    unboundReadOnly:
      servers: quokka.canfar.internal
      poolInitSize: 1
      poolMaxSize: 10
      secure: true
      port: 10636
