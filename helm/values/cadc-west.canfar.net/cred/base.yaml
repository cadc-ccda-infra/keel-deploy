# CADC West cred/CDP — shared defaults; chart schema:
# oci://bucket.canfar.net/charts/cred (0.1.0)
# Upstream: opencadc/cdp cred/helm
#
# image.repository / image.tag / image.pullPolicy: use the chart's values.yaml
# (released with each chart version) unless overridden per environment.
#
# Secrets (pre-create in the release namespace; credentials are not in Git):
#   - cred-signcert: signcert.pem
#   - servops-clientcert: cadcproxy.pem
#   - cookie-signature-private-key: RsaSignaturePriv.key
#     (projected into /config/RsaSignaturePub.key)

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 8675309
  runAsGroup: 8675309
  fsGroup: 8675309
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  runAsNonRoot: true
  runAsUser: 8675309
  runAsGroup: 8675309
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

replicaCount: 1

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        preference:
          matchExpressions:
            - key: skaha.opencadc.org/node-type
              operator: In
              values:
                - service-node
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.count
              operator: DoesNotExist

application:
  applicationName: cred
  identityManagerClass: ca.nrc.cadc.ac.ACIdentityManager
  enableClientCertHeader: true
  allowBasicATP: true

  resourceID: ivo://cadc.nrc.ca/cred
  gmsID: ivo://cadc.nrc.ca/gms
  oidcURI: ivo://cadc.nrc.ca/gms

  superUsers:
    - cn=servops_4a2,ou=cadc,o=hia,c=ca
    - cn=jouellet_c3d,ou=cadc,o=hia,c=ca
    - cn=patrick dowler,ou=nrc-cnrc.gc.ca,o=grid,c=ca
    - cn=geoffrey_ea6,ou=cadc,o=hia,c=ca

  maxDaysValid: "30.0"

  signingCert:
    existingSecret: cred-signcert
    key: signcert.pem

  cadcproxy:
    existingSecret: servops-clientcert
    key: cadcproxy.pem

  cookieSignaturePublicKey:
    existingSecret: cookie-signature-public-key
    key: RsaSignaturePub.key

livenessProbe:
  httpGet:
    path: /cred/availability
    port: http
  initialDelaySeconds: 10
  periodSeconds: 60
  timeoutSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /cred/availability
    port: http
  initialDelaySeconds: 10
  periodSeconds: 60
  timeoutSeconds: 30
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /cred/availability
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 30
  failureThreshold: 30

ingress:
  enabled: true
  className: ""
  annotations: {}

serviceAccount:
  create: false
  automount: false
